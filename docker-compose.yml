services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      retries: 15
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  tts:
    build: ./tts
    restart: unless-stopped
    profiles: ["voice"]
    environment:
      HF_HOME: /models/huggingface
      TTS_CACHE_DIR: /models/audio
    volumes:
      - ttsdata:/models
    # The Bashkir model is downloaded on first synthesis; no ports exposed publicly.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.bot
    profiles: ["telegram"]
volumes:
  pgdata:
  ttsdata:
